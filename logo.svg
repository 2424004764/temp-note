<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 主背景圆角矩形渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 便签纸张立体阴影 -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>

    <!-- 折角阴影 -->
    <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>

    <!-- 便签纸主体渐变 -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- 顶层标签渐变 -->
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- 闪电/速记笔触渐变 -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- 外层圆角底座 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- 背景微弱几何光晕 -->
  <circle cx="420" cy="90" r="180" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="80" cy="440" r="140" fill="#1e3a8a" fill-opacity="0.25"/>

  <!-- 主体群组 -->
  <g filter="url(#dropShadow)">
    <!-- 底层便签叠层效果 (体现多便签、多标签) -->
    <rect x="140" y="100" width="270" height="310" rx="26" fill="#93c5fd" opacity="0.5" transform="rotate(7 275 255)"/>

    <!-- 中层便签叠层 -->
    <rect x="110" y="105" width="270" height="310" rx="26" fill="#bfdbfe" opacity="0.8" transform="rotate(-4 245 260)"/>

    <!-- 顶层主便签纸 (切角折角) -->
    <path d="M 124 100 
             L 310 100 
             L 388 178 
             L 388 386 
             A 26 26 0 0 1 362 412 
             L 124 412 
             A 26 26 0 0 1 98 386 
             L 98 126 
             A 26 26 0 0 1 124 100 Z" 
          fill="url(#paperGrad)"/>

    <!-- 便签纸右上角折角 -->
    <path d="M 310 100 
             L 310 162 
             A 16 16 0 0 0 326 178 
             L 388 178 Z" 
          fill="#cbd5e1" 
          filter="url(#foldShadow)"/>
    <path d="M 310 100 
             L 310 162 
             A 16 16 0 0 0 326 178 
             L 388 178 Z" 
          fill="#e2e8f0"/>

    <!-- 顶部多彩多标签示意条 (Tabs) -->
    <rect x="134" y="128" width="52" height="10" rx="5" fill="#3b82f6"/>
    <rect x="194" y="128" width="40" height="10" rx="5" fill="#94a3b8" opacity="0.6"/>
    <rect x="242" y="128" width="40" height="10" rx="5" fill="#94a3b8" opacity="0.4"/>

    <!-- 便签内容横线 (Markdown 文本行骨架) -->
    <rect x="134" y="164" width="140" height="14" rx="7" fill="#1e293b"/>
    <rect x="134" y="196" width="220" height="10" rx="5" fill="#64748b"/>
    <rect x="134" y="222" width="180" height="10" rx="5" fill="#94a3b8"/>
    <rect x="134" y="248" width="200" height="10" rx="5" fill="#cbd5e1"/>

    <!-- 列表标记小圆点 -->
    <circle cx="140" cy="288" r="6" fill="#3b82f6"/>
    <rect x="158" y="283" width="160" height="10" rx="5" fill="#64748b"/>

    <circle cx="140" cy="318" r="6" fill="#10b981"/>
    <rect x="158" y="313" width="130" height="10" rx="5" fill="#64748b"/>

    <circle cx="140" cy="348" r="6" fill="#f59e0b"/>
    <rect x="158" y="343" width="180" height="10" rx="5" fill="#94a3b8"/>
  </g>

  <!-- 闪电灵感 / 快速速记角标 (象征临时快速、立等可取) -->
  <g transform="matrix(1 0 0 1 20 0)" filter="url(#dropShadow)">
    <circle cx="370" cy="360" r="42" fill="#ffffff"/>
    <path d="M 374 330 
             L 348 362 
             L 368 362 
             L 364 390 
             L 392 354 
             L 372 354 Z" 
          fill="url(#boltGrad)"/>
  </g>
</svg>
